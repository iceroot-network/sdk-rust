[package]
name = "iceroot-sdk"
description = "The IceRoot SDK for Rust: the one crate applications depend on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The node API client's async HTTP transport over reqwest (`api::HttpClient`). Native targets
# only: on wasm32 the feature adds nothing, and the host language performs the requests.
http = ["iceroot-sdk-api/http"]
# Serialize and Deserialize on the node API client's request values and answers, in the JSON form
# the SDK's bindings share (see the documentation of `api`).
serde = ["iceroot-sdk-api/serde"]
# Test seam of the bindings only: see the feature of the same name in iceroot-sdk-core.
fixed-aux = ["iceroot-sdk-core/fixed-aux"]
# The devnet end-to-end test (tests/e2e.rs), over the HTTP transport. It needs a running devnet,
# which tools/e2e/devnet.sh starts and stops, and runs only when asked for (`-- --ignored`).
e2e = ["http"]

[dependencies]
iceroot-sdk-api.workspace = true
iceroot-sdk-core.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }

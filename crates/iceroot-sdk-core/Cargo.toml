[package]
name = "iceroot-sdk-core"
description = "The core of the IceRoot SDK: network profiles, recovery phrases and keys, addresses, amounts, transaction drafts and signing, message signing and sign-in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Test seam: `Aux::fixed`, so that bindings (WebAssembly, later Go) can sign with chosen auxiliary
# bytes and compare their signatures with native Rust byte for byte. Only the test builds of the
# bindings enable it; no published build does, and tools/check-deps.sh refuses it in the default
# build.
fixed-aux = ["heartwood-crypto/fixed-aux"]

[dependencies]
getrandom.workspace = true
heartwood-crypto.workspace = true
# The node API client's IceRoot-shaped values, which the core reads into its own inputs
# (src/node.rs). No I/O and no HTTP: the client's `http` feature stays off here.
iceroot-sdk-api.workspace = true
hmac.workspace = true
icu_normalizer.workspace = true
pbkdf2.workspace = true
secp256k1.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# In a browser, a worker or Node, randomness comes from crypto.getRandomValues.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
# The vector tests sign with a fixed aux, exactly as Heartwood's own tests do. A dev-dependency
# feature never reaches a normal build (tools/check-deps.sh checks it).
heartwood-crypto = { workspace = true, features = ["fixed-aux"] }
hex.workspace = true
unicode-normalization.workspace = true

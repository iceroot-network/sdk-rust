[workspace]
resolver = "3"
members = ["crates/iceroot-sdk-core", "crates/iceroot-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The same minimum as Heartwood Core, whose byte layer every crate here builds on.
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/iceroot-network/sdk-rust"
publish = false

[workspace.lints.rust]
# Binding crates (WebAssembly, the native plugin, the Go exports) override this in their own
# manifest; every other crate forbids unsafe code.
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.dependencies]
iceroot-sdk-core = { path = "crates/iceroot-sdk-core" }

# Heartwood Core's byte-exact layer: keys, addresses, signatures, the transaction codec and the
# milestone rules. No feature is enabled here; tools/check-deps.sh keeps it that way. The consensus
# crates of heartwood-core are never dependencies of the SDK.
heartwood-crypto = { git = "ssh://git@github-iceroot/iceroot-network/heartwood-core.git", rev = "c01da1e" }

# The same exact version as heartwood-crypto's own pin. The SDK uses it directly for one operation
# only, the scalar addition of the hardened BIP32 step; every key, address and signature still
# comes from heartwood-crypto.
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std"] }

# Recovery phrases and wallet derivation: SHA-256 and SHA-512 (digest 0.11, as heartwood-crypto),
# HMAC-SHA512, PBKDF2 and the NFKD normalisation BIP39 requires.
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
unicode-normalization = "0.1.25"

zeroize = "1.9"
getrandom = "0.4"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"

# Tests only.
hex = "0.4"

[profile.release]
overflow-checks = true

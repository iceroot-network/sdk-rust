[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The same minimum as Heartwood Core, whose byte layer every crate here builds on.
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/iceroot-network/sdk-rust"
publish = false

[workspace.lints.rust]
# Binding crates (WebAssembly, the native plugin, the Go exports) override this in their own
# manifest; every other crate forbids unsafe code.
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

# No panics on untrusted input. Tests may unwrap (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.dependencies]
iceroot-sdk-core = { path = "crates/iceroot-sdk-core" }
iceroot-sdk-api = { path = "crates/iceroot-sdk-api" }
iceroot-vote = { path = "crates/iceroot-vote" }

# Heartwood Core's byte-exact layer: keys, addresses, signatures, the transaction codec, the
# milestone rules, the fee floor and the message signing domain, at its tagged release. No feature
# is enabled here; tools/check-deps.sh keeps it that way. The consensus crates of heartwood-core
# are never dependencies of the SDK.
heartwood-crypto = { git = "ssh://git@github.com/iceroot-network/heartwood-core.git", tag = "crypto-v0.1.0" }

# The same exact version as heartwood-crypto's own pin. The SDK uses it directly for one operation
# only, the scalar addition of the hardened BIP32 step; every key, address and signature still
# comes from heartwood-crypto.
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std"] }

# Recovery phrases and wallet derivation: SHA-256 and SHA-512 (digest 0.11, as heartwood-crypto),
# HMAC-SHA512, PBKDF2 and the NFKD normalisation BIP39 requires. The normaliser is ICU4X's, with its
# data compiled in: the same crate the `http` feature already brings in through URL parsing, and
# about half the size of the alternatives in the WebAssembly module.
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Tests only: a second NFKD implementation that the normaliser is compared with, code point by code
# point.
unicode-normalization = "0.1.25"

zeroize = "1.9"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
thiserror = "2"

# Native HTTP for the optional `http` feature of iceroot-sdk-api. Never part of a WebAssembly build.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", default-features = false, features = ["time"] }

# Tests only.
hex = "0.4"
proptest = "1.11"

[profile.release]
overflow-checks = true

# The vote library's property test draws about 40,000 selections: light optimization keeps
# debug runs short. Overflow checks and debug assertions stay on.
[profile.dev.package.iceroot-vote]
opt-level = 1

[profile.dev.package.proptest]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[package]
name = "iceroot-sdk-ffi"
description = "JSON exports for the IceRoot SDK's pure Go WebAssembly host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[features]
default = []
test-seams = ["iceroot-sdk-bindings/fixed-aux", "iceroot-sdk-bindings/keystore-testing"]

[dependencies]
iceroot-sdk.workspace = true
iceroot-sdk-bindings.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
secp256k1 = { workspace = true, features = ["lowmemory"] }

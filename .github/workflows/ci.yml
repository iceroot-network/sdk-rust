name: SDK checks

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: sdk-rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # libsecp256k1 is C: the wasm32 build compiles it with clang.
  CC_wasm32_unknown_unknown: clang-18
  AR_wasm32_unknown_unknown: llvm-ar-18
  CC_wasm32_wasip1: clang-18
  AR_wasm32_wasip1: llvm-ar-18

jobs:
  production-merge:
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'push' && github.event.created == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the merged dev to prod pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" --jq '[.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA and .base.ref == "prod" and .head.ref == "dev" and .base.repo.full_name == env.GITHUB_REPOSITORY and .head.repo.full_name == env.GITHUB_REPOSITORY)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 2
          done
          echo "::error::Production CI requires this exact commit to be a merged dev to prod PR in this repository."
          exit 1

  checks:
    needs: production-merge
    # Pull requests run without the production gate; pushes to prod only after it.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.production-merge.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98.0'
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
      - name: Install clang and llvm-ar for the wasm32 build
        run: |
          command -v clang-18 >/dev/null && command -v llvm-ar-18 >/dev/null ||
            (sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 llvm-18)
      - name: Read access to heartwood-core
        env:
          HEARTWOOD_TOKEN: ${{ secrets.HEARTWOOD_TOKEN }}
        run: tools/ci/heartwood-access.sh
      # The cache holds Cargo's git database, which is heartwood-core's history while that
      # repository is private. A pull request from a fork can restore the caches of this
      # repository's branches, so only pull request runs save one: theirs is kept under the pull
      # request's own ref, which no other pull request can read.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'pull_request' }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints, native, with every feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Lints, wasm32
        run: cargo clippy --locked --workspace --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Tests, with Heartwood Core's vectors and the SDK's vectors
        run: cargo test --locked --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Build for wasm32
        run: cargo build --locked --workspace --lib --target wasm32-unknown-unknown --release
      - name: Dependency guard
        run: tools/check-deps.sh
      - name: NOTICE matches the dependency tree
        run: node tools/notice.mjs --check

  # The Tauri plugin, a workspace of its own: it builds against the webview's libraries (WebKitGTK
  # on Linux), and for Android with the runner's NDK.
  tauri-plugin:
    needs: production-merge
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.production-merge.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/tauri-plugin-iceroot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98.0'
          components: rustfmt,clippy
          targets: aarch64-linux-android
      - name: Install the webview's development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - name: Read access to heartwood-core
        working-directory: .
        env:
          HEARTWOOD_TOKEN: ${{ secrets.HEARTWOOD_TOKEN }}
        run: tools/ci/heartwood-access.sh
      # As in the checks job, only pull request runs save the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/tauri-plugin-iceroot -> target
          save-if: ${{ github.event_name == 'pull_request' }}
      - name: Formatting
        run: cargo fmt -- --check
      - name: Lints, without and with the test seams
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      # A changed file shows in the diff; a newly generated one only as untracked.
      - name: The generated permissions are committed
        working-directory: .
        run: |
          git diff --exit-code -- crates/tauri-plugin-iceroot/permissions
          untracked=$(git ls-files --others --exclude-standard -- crates/tauri-plugin-iceroot/permissions)
          if [ -n "$untracked" ]; then
            printf 'Generated but not committed:\n%s\n' "$untracked"
            exit 1
          fi
      # The library alone is only compiled; linking it as a shared library, as an Android app
      # loads the application's code, also runs the NDK's linker. `-z defs` makes a symbol that
      # nothing defines a link error (a shared library is otherwise allowed to leave it to the
      # loader). The plugin exports no JNI function; the application's library does, and is
      # linked in sdk-typescript's Tauri example.
      - name: Build and link for Android (aarch64-linux-android)
        run: |
          set -euo pipefail
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
          cargo build --locked --release --target aarch64-linux-android
          cargo rustc --locked --release --target aarch64-linux-android --lib --crate-type cdylib \
            -- -C link-arg=-Wl,-z,defs
          so=target/aarch64-linux-android/release/libtauri_plugin_iceroot.so
          test -s "$so"
          kind=$(file -b "$so")
          echo "$kind"
          [[ "$kind" == "ELF 64-bit LSB shared object, ARM aarch64"* ]]

  # The Tauri plugin for macOS and iOS, on a macOS runner: Xcode supplies both SDKs, the linker
  # and, for iOS, the Swift compiler Tauri's build script builds its Swift library with. Nothing
  # runs on a device or in a simulator.
  tauri-plugin-apple:
    needs: production-merge
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.production-merge.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/tauri-plugin-iceroot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98.0'
          targets: aarch64-apple-darwin,aarch64-apple-ios
      - name: Read access to heartwood-core
        working-directory: .
        env:
          HEARTWOOD_TOKEN: ${{ secrets.HEARTWOOD_TOKEN }}
        run: tools/ci/heartwood-access.sh
      # The library alone is only compiled; linking it as a shared library also runs Apple's
      # linker, which refuses a symbol that nothing defines. rustc and the C builds find each
      # target's SDK through xcrun, so SDKROOT stays unset: set to the iOS SDK, it would also
      # reach the build scripts, which are built for macOS.
      - name: Build and link for macOS and iOS
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
          for target in aarch64-apple-darwin aarch64-apple-ios; do
            cargo build --locked --release --target "$target"
            cargo rustc --locked --release --target "$target" --lib --crate-type cdylib
            dylib="target/$target/release/libtauri_plugin_iceroot.dylib"
            test -s "$dylib"
            kind=$(file -b "$dylib")
            echo "$kind"
            [[ "$kind" == "Mach-O 64-bit dynamically linked shared library arm64"* ]]
          done

  # Heartwood Core's dev branch, where the next heartwood-crypto tag is prepared. A failure here
  # warns before the next tag; it does not block a merge.
  heartwood-canary:
    needs: production-merge
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.production-merge.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sdk-rust
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iceroot-network/heartwood-core
          ref: dev
          path: heartwood-core
          token: ${{ secrets.HEARTWOOD_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98.0'
      - name: Read access to heartwood-core
        env:
          HEARTWOOD_TOKEN: ${{ secrets.HEARTWOOD_TOKEN }}
        run: sdk-rust/tools/ci/heartwood-access.sh
      - name: Tests against heartwood-core dev
        working-directory: sdk-rust
        run: |
          set -euo pipefail
          url=$(sed -n 's/^heartwood-crypto = { git = "\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$url"
          cargo test --workspace --all-features \
            --config "patch.'$url'.heartwood-crypto.path='$GITHUB_WORKSPACE/heartwood-core/packages/crypto'"
